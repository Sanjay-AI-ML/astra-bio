[project]
name = "astra-bio"
version = "0.1.0"
description = "Nutrition-aware crop and resource planning demonstrator for ASTRA-BIO."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "pyomo>=6.9,<7",
    "highspy>=1.10,<2",
    "paho-mqtt==2.1.0",
    "pymongo>=4.13,<5",
    "cryptography>=45,<50",
    "onnxruntime>=1.20,<2",
    "Pillow>=11,<13",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
