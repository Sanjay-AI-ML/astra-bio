[platformio]
default_envs = esp32-s3-camera-n16r8

[env:esp32-s3-camera-n16r8]
; Candidate N16R8 carrier. Root hardware diagnostics must confirm before upload.
; Supplied camera map lives in src/main.cpp and does not imply another carrier.
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
build_flags = -DBOARD_HAS_PSRAM
; CH343 bridge uses the ordinary UART Serial, not native USB CDC.
monitor_speed = 115200
upload_speed = 460800
lib_deps = bblanchon/ArduinoJson @ 7.4.3
