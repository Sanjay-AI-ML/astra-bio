[env:esp32-s3]
; Generic ESP32-S3 toolchain profile only. Confirm the actual carrier board,
; flash size, PSRAM and USB/upload settings before flashing your WROOM board.
platform = espressif32 @ 7.1.3
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson @ 7.4.3

