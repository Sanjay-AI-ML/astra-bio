# Local laptop demo. No remote client access and no hardware control enabled.
# Start explicitly with: mosquitto -c integration/mosquitto.local.conf
listener 1883 127.0.0.1
allow_anonymous false
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# For an ESP32 on the LAN, use a separate reviewed configuration with an
# explicit private-LAN listener, allow_anonymous false, password_file and ACL.
# See docs/IOT_SETUP.md. Do not expose this demo listener to the internet.
