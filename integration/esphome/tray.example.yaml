# PROPOSED BENCH CONFIGURATION: not flashed or hardware-validated.
# GPIO mapping is an example; check your exact ESP32-S3 module/pinout first.
# Outputs remain OFF: actuation_enabled is false and cannot be set by MQTT.
substitutions:
  device_name: astra-tray-01
  device_id: tray-01
  i2c_sda: GPIO8
  i2c_scl: GPIO9
  float_pin: GPIO4
  one_wire_pin: GPIO5
  pump_pin: GPIO6
  fan_pin: GPIO7
  light_pin: GPIO10
  stop_button_pin: GPIO16

esphome:
  name: ${device_name}
  friendly_name: ASTRA BIO Tray 01
  on_boot:
    priority: -100
    then:
      - switch.turn_off: pump_output
      - switch.turn_off: fan_output
      - switch.turn_off: light_output

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: arduino
    sdkconfig_options:
      # Date checks require SNTP before the first TLS MQTT connection.
      CONFIG_MBEDTLS_HAVE_TIME: "y"
      CONFIG_MBEDTLS_HAVE_TIME_DATE: "y"

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

# Deliberately no native api: or remote web-server GPIO controls.
mqtt:
  id: mqtt_client
  # A cold-boot ESP32 must obtain time before validating certificate dates.
  enable_on_boot: false
  broker: !secret mqtt_broker
  port: 8883
  certificate_authority: !secret mqtt_ca_certificate
  skip_cert_cn_check: false
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false
  discover_ip: false
  reboot_timeout: 0s
  topic_prefix: astra-bio/devices/${device_id}
  log_topic: null
  birth_message:
    topic: astra-bio/devices/${device_id}/availability
    payload: online
    qos: 1
    retain: true
  will_message:
    topic: astra-bio/devices/${device_id}/availability
    payload: offline
    qos: 1
    retain: true
  shutdown_message:
    topic: astra-bio/devices/${device_id}/availability
    payload: offline
    qos: 1
    retain: true
  on_disconnect:
    then:
      - script.stop: guarded_pump
      - switch.turn_off: pump_output
      - switch.turn_off: fan_output
      - switch.turn_off: light_output
      - lambda: id(pump_busy) = false;
  on_json_message:
    - topic: astra-bio/devices/${device_id}/command
      then:
        - lambda: |-
            // STOP always makes outputs safe; it does not need a valid clock.
            if (!x["action"].is<const char *>()) return;
            const std::string action = x["action"].as<std::string>();
            if (action == "stop") {
              id(guarded_pump).stop();
              id(pump_output).turn_off();
              id(fan_output).turn_off();
              id(light_output).turn_off();
              id(pump_busy) = false;
              ESP_LOGI("astra", "STOP accepted");
              return;
            }
            if (action != "pump_pulse") {
              ESP_LOGW("astra", "Unsupported command; no output changed");
              return;
            }
            if (!id(actuation_enabled)) {
              ESP_LOGW("astra", "Actuation disabled in this bench configuration");
              return;
            }
            if (!x["command_id"].is<const char *>() ||
                !x["expires_at"].is<uint32_t>() ||
                !x["duration_seconds"].is<int>()) {
              ESP_LOGW("astra", "Malformed command rejected");
              return;
            }
            const auto now = id(tray_time).now();
            const uint32_t expires = x["expires_at"].as<uint32_t>();
            const int seconds = x["duration_seconds"].as<int>();
            const std::string command_id = x["command_id"].as<std::string>();
            if (!now.is_valid() || expires <= now.timestamp ||
                expires > now.timestamp + 15 || seconds < 1 || seconds > 10 ||
                command_id.empty() || command_id.size() > 64 ||
                command_id == id(last_command_id) || id(pump_busy) ||
                !id(low_water).has_state() || id(low_water).state ||
                id(local_stop).state) {
              ESP_LOGW("astra", "Unsafe, stale, duplicate or busy command rejected");
              return;
            }
            id(last_command_id) = command_id;
            id(guarded_pump).execute(seconds * 1000);

time:
  - platform: sntp
    id: tray_time
    timezone: Etc/UTC
    servers:
      - !secret ntp_server
    on_time_sync:
      then:
        - if:
            condition:
              lambda: return id(tray_time).now().is_valid();
            then:
              - mqtt.enable:

i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true
  frequency: 100kHz

one_wire:
  - platform: gpio
    pin: ${one_wire_pin}

globals:
  - id: actuation_enabled
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pump_busy
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pump_started_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_command_id
    type: std::string
    restore_value: false
    initial_value: '""'

sensor:
  - platform: sht3xd
    address: 0x44
    temperature:
      id: air_temperature
      internal: true
    humidity:
      id: air_humidity
      internal: true
    update_interval: 5s
  - platform: dallas_temp
    id: solution_temperature
    internal: true
    update_interval: 5s
  - platform: veml7700
    address: 0x10
    ambient_light:
      name: Tray light illuminance
      id: tray_lux
      internal: true
    update_interval: 5s
  - platform: ina260
    address: 0x40
    current:
      id: actuator_current
      internal: true
    power:
      id: actuator_power
      internal: true
    bus_voltage:
      id: actuator_voltage
      internal: true
    update_interval: 5s

binary_sensor:
  - platform: gpio
    id: low_water
    internal: true
    pin:
      number: ${float_pin}
      mode: INPUT_PULLUP
      inverted: false
    # Normally closed to GND when water is adequate. Open/cable break => HIGH.
    # Confirm actual float orientation/polarity before connecting a pump.
    filters:
      - delayed_off: 1s
    on_press:
      then:
        - script.stop: guarded_pump
        - switch.turn_off: pump_output
        - lambda: id(pump_busy) = false;
  - platform: gpio
    id: local_stop
    internal: true
    pin:
      number: ${stop_button_pin}
      mode: INPUT_PULLUP
      inverted: true
    # Optional momentary local STOP button to GND; never enables an output.
    on_press:
      then:
        - script.stop: guarded_pump
        - switch.turn_off: pump_output
        - switch.turn_off: fan_output
        - switch.turn_off: light_output
        - lambda: id(pump_busy) = false;

switch:
  - platform: gpio
    id: pump_output
    internal: true
    pin: ${pump_pin}
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: fan_output
    internal: true
    pin: ${fan_pin}
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: light_output
    internal: true
    pin: ${light_pin}
    restore_mode: ALWAYS_OFF

script:
  - id: guarded_pump
    mode: single
    parameters:
      duration_ms: int
    then:
      - if:
          condition:
            lambda: |-
              return id(actuation_enabled) && duration_ms >= 1000 &&
                duration_ms <= 10000 && id(low_water).has_state() &&
                !id(low_water).state && id(local_stop).has_state() &&
                !id(local_stop).state &&
                !id(pump_busy);
          then:
            - lambda: id(pump_busy) = true;
            - lambda: id(pump_started_ms) = millis();
            - switch.turn_on: pump_output
            - delay: !lambda return duration_ms;
            - switch.turn_off: pump_output
            - delay: 2s
            - lambda: id(pump_busy) = false;

interval:
  # Software watchdog reinforces the script's bound. Low-water event is immediate.
  - interval: 250ms
    then:
      - if:
          condition:
            lambda: |-
              return !id(actuation_enabled) || !id(low_water).has_state() ||
                id(low_water).state || !id(local_stop).has_state() ||
                id(local_stop).state || (id(pump_output).state &&
                static_cast<uint32_t>(millis() - id(pump_started_ms)) >= 10000);
          then:
            - switch.turn_off: pump_output
  - interval: 10s
    then:
      - mqtt.publish_json:
          topic: astra-bio/devices/${device_id}/telemetry
          qos: 1
          retain: false
          payload: |-
            root["device_id"] = "${device_id}";
            root["source"] = "hardware";
            auto now = id(tray_time).now();
            if (now.is_valid()) {
              root["ts_utc"] = now.strftime("%Y-%m-%dT%H:%M:%SZ");
              root["timestamp_origin"] = "device";
            }
            root["clock_synced"] = now.is_valid();
            root["uptime_s"] = millis() / 1000;
            // Missing/failed sensors stay absent; do not fabricate readings.
            if (id(air_temperature).has_state() && std::isfinite(id(air_temperature).state))
              root["air_temp_c"] = id(air_temperature).state;
            if (id(air_humidity).has_state() && std::isfinite(id(air_humidity).state))
              root["relative_humidity_pct"] = id(air_humidity).state;
            if (id(solution_temperature).has_state() && std::isfinite(id(solution_temperature).state))
              root["solution_temp_c"] = id(solution_temperature).state;
            if (id(tray_lux).has_state() && std::isfinite(id(tray_lux).state))
              root["light_lux"] = id(tray_lux).state;
            if (id(actuator_voltage).has_state() && std::isfinite(id(actuator_voltage).state))
              root["bus_voltage_v"] = id(actuator_voltage).state;
            if (id(actuator_current).has_state() && std::isfinite(id(actuator_current).state))
              root["bus_current_a"] = id(actuator_current).state;
            if (id(actuator_power).has_state() && std::isfinite(id(actuator_power).state))
              root["bus_power_w"] = id(actuator_power).state;
            if (id(low_water).has_state()) root["low_water"] = id(low_water).state;
            root["pump_on"] = id(pump_output).state;
            root["fan_on"] = id(fan_output).state;
            root["light_on"] = id(light_output).state;
            root["actuation_enabled"] = id(actuation_enabled);
